name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # Model-dependent tests skip when models/Ollama are absent; this keeps any
  # straggler from attempting a Hugging Face download on the runner.
  VOXFLOW_OFFLINE: "1"

jobs:
  swift:
    name: Swift build + test
    # Swift 6.2 toolchain (Xcode 26) — needs a macOS 26 image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  lint:
    name: Ruff (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Non-blocking for now: surfaces real dead-code / undefined-name
      # regressions on every PR without failing the build. Promote to a hard
      # gate (drop continue-on-error) once the tree stays clean for a few PRs.
      - name: Ruff
        continue-on-error: true
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "check backend/app --output-format=github"

  python:
    name: Python tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: py
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Dedicated venv: on the macOS arm64 image the toolcache python is a
      # shim into /Library/Frameworks, so pip and pytest diverged across
      # interpreters even with an explicit python-path (runs 1 and 2 both
      # died with "No module named pytest"). Venv binaries are
      # self-referential — install and test cannot disagree.
      - name: Install dependencies
        run: |
          ${{ steps.py.outputs.python-path }} -m venv .ci-venv
          ./.ci-venv/bin/python -m pip install -r backend/requirements-dev.txt

      - name: Test
        run: ./.ci-venv/bin/python -m pytest backend/tests -q
